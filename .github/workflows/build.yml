name: Build sscheathack.exe

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pyinstaller
      - run: pyinstaller --onefile --noconsole --name sscheathack sscheathack.py
      - uses: actions/upload-artifact@v4
        with:
          name: sscheathack-windows
          path: dist/sscheathack.exe
